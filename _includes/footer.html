<footer class="site-footer glass-panel">
    <div class="site-footer__inner site-container">
        <div>
            <strong>{{ site.title }}</strong>
            <p>{% if site.description_footer %}{{ site.description_footer }}{% endif %}</p>
        </div>
        <div class="site-footer__links" aria-label="联系方式">
            {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}" aria-label="GitHub"><i class="fa fa-github" aria-hidden="true"></i></a>{% endif %}
            {% if site.email %}<a href="mailto:{{ site.email }}" aria-label="电子邮箱"><i class="fa fa-envelope-o" aria-hidden="true"></i></a>{% endif %}
        </div>
        <p class="site-footer__stats">
            总访问量 <span id="busuanzi_value_site_pv">—</span> · 访客 <span id="busuanzi_value_site_uv">—</span> · 本文阅读 <span id="busuanzi_value_page_pv">—</span>
        </p>
        <p class="site-footer__meta">Powered by <a href="https://jekyllrb.com/">Jekyll</a> &amp; <a href="https://pages.github.com/">GitHub Pages</a>.</p>
    </div>
</footer>
<script async src="https://dn-lbstatics.qbox.me/busuanzi/2.3/busuanzi.pure.mini.js"></script>
